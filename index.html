<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mula Study</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;--bg:#0F172A;--ink:#EDEAF2;--ink-dim:#9C97A8;
  --accent:#B6A6E0;--accent-soft:#332B4A;--danger:#D98873;--good:#7FBF9E;
  --glass-bg:rgba(255,255,255,.07);--glass-border:rgba(255,255,255,.14);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 32px rgba(0,0,0,.4);
  --surface:var(--glass-bg);--border:var(--glass-border);
  --mesh:radial-gradient(circle at 15% 8%,rgba(91,75,138,.32),transparent 40%),radial-gradient(circle at 88% 15%,rgba(63,122,92,.26),transparent 42%),radial-gradient(circle at 50% 100%,rgba(166,67,47,.18),transparent 55%);
  --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F172A;--ink:#EDEAF2;--ink-dim:#9C97A8;--accent:#B6A6E0;--accent-soft:#332B4A;--danger:#D98873;--good:#7FBF9E;
  --glass-bg:rgba(255,255,255,.07);--glass-border:rgba(255,255,255,.14);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 32px rgba(0,0,0,.4);
  --surface:var(--glass-bg);--border:var(--glass-border);}}
:root[data-theme="dark"]{
  --bg:#0F172A;--ink:#EDEAF2;--ink-dim:#9C97A8;--accent:#B6A6E0;--accent-soft:#332B4A;--danger:#D98873;--good:#7FBF9E;
  --glass-bg:rgba(255,255,255,.07);--glass-border:rgba(255,255,255,.14);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 32px rgba(0,0,0,.4);
  --surface:var(--glass-bg);--border:var(--glass-border);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background-color:var(--bg);background-image:var(--mesh);background-attachment:fixed;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;}
h1{font-size:22px;letter-spacing:-0.01em;}
h2{font-size:13px;color:var(--ink-dim);font-weight:600;margin-bottom:8px;}
p{margin:0;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#app{max-width:520px;margin:0 auto;padding:20px 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh;}
.head{margin-bottom:18px;}
.sub{font-size:13px;color:var(--ink-dim);margin-top:2px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.stat{background:var(--surface);border-radius:10px;padding:10px 12px;}
.stat b{font-family:var(--mono);font-size:19px;display:block;}
.stat span{font-size:11px;color:var(--ink-dim);}
.card{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);}
.tip{border-color:var(--accent);margin-bottom:16px;}
.stat,.card,.chip,.timer-box,.review,#tabbar{backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--glass-shadow);}
.row{display:flex;align-items:center;gap:10px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.grow{flex:1;min-width:0;}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta{font-size:12px;color:var(--ink-dim);margin-top:2px;}
.iconbtn{background:none;border:none;padding:6px;color:var(--ink-dim);display:flex;}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--field);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;}
textarea{resize:none;}
.form{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.form input,.form select{flex:1;min-width:90px;}
.btn{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;white-space:nowrap;}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--ink);}
.btn:disabled{opacity:.4;}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.check.done{background:var(--good);border-color:var(--good);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
.chip.active{border-color:var(--accent);color:var(--accent);}
.empty{color:var(--ink-dim);font-size:14px;padding:8px 2px;}
.timer-box{background:var(--surface);border-radius:16px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
.timer-mode{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);margin-bottom:6px;}
.timer-num{font-family:var(--mono);font-size:56px;line-height:1;margin-bottom:22px;}
.timer-controls{display:flex;gap:12px;align-items:center;}
.round{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--bg);border:none;display:flex;align-items:center;justify-content:center;}
.round.ghost{width:44px;height:44px;background:none;border:1px solid var(--border);color:var(--ink-dim);}
.durations{display:flex;gap:16px;margin-bottom:14px;font-size:12px;color:var(--ink-dim);align-items:center;}
.durations input{width:52px;padding:6px 8px;}
.review{background:var(--surface);border-radius:14px;padding:44px 20px;text-align:center;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;margin-bottom:16px;}
.review-actions{display:flex;justify-content:center;gap:10px;}
#tabbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:16px;right:16px;display:flex;background:var(--surface);border:1px solid var(--border);padding:6px;border-radius:26px;}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:7px 2px;font-size:10.5px;color:var(--ink-dim);border-radius:18px;}
#tabbar button.active{color:var(--accent);background:var(--accent-soft);}
#tabbar svg{width:21px;height:21px;}
:root{--field:#121212;--track:rgba(255,255,255,.1);}
:root[data-theme="light"]{color-scheme:light;--bg:#F3F1F8;--ink:#1B1830;--ink-dim:#615C75;--accent:#5B4B8A;--accent-soft:#E2DBF2;--danger:#B4452E;--good:#2F7D55;
  --glass-bg:rgba(255,255,255,.7);--glass-border:rgba(70,55,120,.16);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 24px rgba(70,55,120,.12);
  --surface:var(--glass-bg);--border:var(--glass-border);--field:#fff;--track:rgba(70,55,120,.12);
  --mesh:radial-gradient(circle at 15% 8%,rgba(150,130,210,.30),transparent 42%),radial-gradient(circle at 88% 15%,rgba(110,190,150,.22),transparent 44%),radial-gradient(circle at 50% 100%,rgba(230,150,120,.18),transparent 55%);}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.brand{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);}
.brand img{border-radius:9px;display:block;}
.brand em{font-style:normal;color:var(--ink-dim);font-weight:500;}
.switch{width:54px;height:30px;border-radius:15px;border:1px solid var(--border);background:var(--surface);padding:2px;display:flex;align-items:center;}
.switch .knob{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.switch[aria-checked=true] .knob{transform:translateX(24px);}
.knob svg{width:14px;height:14px;}
#welcome{display:none;position:fixed;inset:0;z-index:50;overflow-y:auto;background-color:var(--bg);background-image:var(--mesh);}
.wel-in{max-width:420px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;}
.wel-top{align-self:flex-end;}
.wel-logo{width:150px;height:150px;border-radius:34px;margin:14px 0 20px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.wel-h{font-size:28px;margin-bottom:6px;}
.wel-feats{display:grid;gap:8px;width:100%;margin:22px 0 16px;text-align:left;}
.wel-feats .card{margin:0;}
.wel-go{width:100%;padding:13px;font-size:15px;margin-top:12px;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('studydesk_theme')||'dark');}catch(e){}</script>

function setStatus(m){syncMsg=m;const el=document.getElementById('syncst');if(el)el.textContent=m;}
function push(){if(!ref)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(flush,400);}
async function flush(){
  if(!ref||!dirty)return;
  if(pushing){pushT=setTimeout(flush,400);return;}
  pushing=true;dirty=false;
  try{await ref.set({s:S,at:Date.now()});setStatus('Synced');}
  catch(e){dirty=true;setStatus('Sync failed, will retry on next change');}
  pushing=false;
}
function mergeHw(a,b){a=a||{};b=b||{};const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{o[k]=[...new Set([...(a[k]||[]),...(b[k]||[])])];});return o;}
function merge(r,l){
  const u=(a,b)=>{a=a||[];const ids=new Set(a.map(x=>x.id));return[...a,...(b||[]).filter(x=>!ids.has(x.id))];};
  return{subjects:u(r.subjects,l.subjects),tasks:u(r.tasks,l.tasks),sessions:u(r.sessions,l.sessions),decks:u(r.decks,l.decks),notes:u(r.notes,l.notes),exam:r.exam||l.exam,name:r.name||l.name,homework:mergeHw(r.homework,l.homework)};
}
function applyState(n){
  S=Object.assign({subjects:[],tasks:[],sessions:[],decks:[],notes:[],homework:{}},n);S.homework=S.homework||{};
  if(!S.subjects.some(x=>x.id===timer.subjectId))timer.subjectId=(S.subjects[0]||{}).id||'';
  cache();
}
async function initSync(){
  try{
    const db=await claude.use('db'),user=await claude.use('user');
    const id=user&&await user.id();
    if(!db||!id)return;
    ref=db.doc('data/users/'+id+'/state');
    let first=true;
    ref.onSnapshot(snap=>{
      const remote=snap.exists?(snap.data()||{}).s:null;
      if(first){
        first=false;
        let synced=false;try{synced=localStorage.getItem('studydesk_synced')==='1';}catch(e){}
        const next=!remote?S:synced?remote:merge(remote,S);
        applyState(next);
        try{localStorage.setItem('studydesk_synced','1');}catch(e){}
        if(!remote||!synced)push();else setStatus('Synced');
        render();setStatus(remote&&synced?'Synced':'Syncing…');
        return;
      }
      if(dirty||pushing||!remote)return;
      if(JSON.stringify(remote)===JSON.stringify(S))return;
      applyState(remote);
      const a=document.activeElement;
      if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
    },e=>setStatus('This device only'));
  }catch(e){}
}
function subjectName(id){const s=S.subjects.find(x=>x.id===id);return s?s.name:'';}
function subjectColor(id){const s=S.subjects.find(x=>x.id===id);return s?s.color:'#999';}

function render(){
  document.getElementById('tabbar').innerHTML=TABS.map(([id,label])=>
    `<button data-tab="${id}" class="${tab===id?'active':''}">${svg(id)}<span>${label}</span></button>`).join('');
  const app=document.getElementById('app');
  let content;
  if(tab==='overview')content=viewOverview();
  else if(tab==='planner')content=viewPlanner();
  else if(tab==='homework')content=viewHomework();
  else if(tab==='focus')content=viewFocus();
  else if(tab==='cards')content=viewCards();
  else content=viewNotes();
  app.innerHTML=topbar()+(tipDismissed?'':tipBanner())+content+`<p class="meta" id="syncst" style="text-align:center;margin-top:18px">${syncMsg}</p>`;
  const w=document.getElementById('welcome');w.innerHTML=showWelcome?welcomeView():'';w.style.display=showWelcome?'block':'none';
  bind();
}

function viewOverview(){
  const wk=addDays(today(),-6);
  const weekMin=S.sessions.filter(s=>s.date>=wk).reduce((a,s)=>a+s.minutes,0);
  const allMin=S.sessions.reduce((a,s)=>a+s.minutes,0);
  const done=S.tasks.filter(t=>t.done).length;
  const days=new Set(S.sessions.map(x=>x.date));let streak=0,dd=today();if(!days.has(dd))dd=addDays(dd,-1);while(days.has(dd)){streak++;dd=addDays(dd,-1);}
  const todayMin=S.sessions.filter(x=>x.date===today()).reduce((a,x)=>a+x.minutes,0);
  const ex=S.exam;const left=ex?Math.ceil((new Date(ex.date)-new Date(today()))/864e5):0;
  const exam=ex?`<div class="card row"><div class="grow"><div style="font-weight:500">${esc(ex.name)}</div><div class="meta">${ex.date}</div></div>
    <b style="font-family:var(--mono);font-size:19px">${left>0?left+' days':left===0?'Today':'Passed'}</b>
    <button class="iconbtn" data-action="clearExam" aria-label="Remove">✕</button></div>`
    :`<form class="form" data-form="setExam"><input type="text" id="examName" placeholder="Exam or goal" required><input type="date" id="examDate" required><button class="btn" type="submit">Set</button></form>`;
  const due=S.decks.flatMap(d=>d.cards).filter(c=>c.due<=today()).length;
  const subjRows=S.subjects.map(s=>{
    const m=S.sessions.filter(x=>x.subjectId===s.id).reduce((a,x)=>a+x.minutes,0);
    const wm=S.sessions.filter(x=>x.subjectId===s.id&&x.date>=wk).reduce((a,x)=>a+x.minutes,0);
    const st=S.tasks.filter(t=>t.subjectId===s.id);const sd=st.filter(t=>t.done).length;
    return `<div class="card row"><span class="dot" style="background:${s.color}"></span>
      <div class="grow"><div class="trunc" style="font-weight:500">${esc(s.name)}</div>
      <div class="meta">${wm}m this week · ${m}m total · ${sd}/${st.length} tasks</div></div>
      <button class="iconbtn" data-action="rmSubject" data-id="${s.id}" aria-label="Remove">✕</button></div>`;
  }).join('');
  return `<div class="head"><h1>${S.name?'Hi, '+esc(S.name):'Overview'}</h1><p class="sub">Where things stand across every subject.</p></div>
  <div class="stats">
    <div class="stat"><b>${weekMin}m</b><span>This week</span></div>
    <div class="stat"><b>${allMin}m</b><span>All time</span></div>
    <div class="stat"><b>${done}/${S.tasks.length}</b><span>Tasks done</span></div>
    <div class="stat"><b style="color:${due?'var(--accent)':'inherit'}">${due}</b><span>Cards due</span></div>
    <div class="stat"><b>${streak}</b><span>Day streak</span></div>
    <div class="stat"><b>${todayMin}m</b><span>Today</span></div>
  </div>
  <h2>Countdown</h2>${exam}
  <h2 style="margin-top:18px">Subjects</h2>
  ${subjRows||'<p class="empty">No subjects yet — add your first one below.</p>'}
  <form class="form" data-form="addSubject" style="margin-top:10px">
    <input type="text" id="subjName" placeholder="e.g. Organic Chemistry" required>
    <button class="btn" type="submit">Add</button>
  </form>`;
}

function viewPlanner(){
  if(!S.subjects.length)return noSubjects(['Planner','What you\'re studying, and when.']);
  const rows=[...S.tasks].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`
    <div class="card row">
      <button class="check ${t.done?'done':''}" data-action="toggleTask" data-id="${t.id}" aria-label="Toggle">${t.done?'✓':''}</button>
      <div class="grow"><div class="trunc" style="${t.done?'color:var(--ink-dim);text-decoration:line-through':''}">${esc(t.title)}</div>
      <div class="meta row" style="gap:5px"><span class="dot" style="background:${subjectColor(t.subjectId)}"></span>${esc(subjectName(t.subjectId))} · ${t.date}</div></div>
      <button class="iconbtn" data-action="rmTask" data-id="${t.id}" aria-label="Delete">✕</button>
    </div>`).join('');
  return `<div class="head"><h1>Planner</h1><p class="sub">What you're studying, and when.</p></div>
  <form class="form" data-form="addTask">
    <input type="text" id="taskTitle" placeholder="Task, e.g. Finish ch. 4 problems" required style="flex-basis:100%">
    <select id="taskSubject">${S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <input type="date" id="taskDate" value="${today()}">
    <button class="btn" type="submit">Add</button>
  </form>

}

  if(!S.subjects.length)return noSubjects(['Focus','One focused block at a time.']);
  if(!timer.subjectId)timer.subjectId=S.subjects[0].id;
  const mm=String(Math.floor(timer.remaining/60)).padStart(2,'0');
  const ss=String(timer.remaining%60).padStart(2,'0');
  const todayMin=S.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.minutes,0);
  return `<div class="head"><h1>Focus</h1><p class="sub">One focused block at a time.</p></div>
  <div class="form" style="align-items:center">
    <select id="focusSubject" ${timer.running?'disabled':''}>${S.subjects.map(s=>`<option value="${s.id}" ${s.id===timer.subjectId?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  </div>
  <div class="durations">
    <span>Focus <input type="number" id="workMin" min="1" max="120" value="${timer.work}" ${timer.running?'disabled':''}> min</span>
    <span>Break <input type="number" id="breakMin" min="1" max="60" value="${timer.break}" ${timer.running?'disabled':''}> min</span>

      <button class="round" id="toggleTimer" aria-label="${timer.running?'Pause':'Start'}">${timer.running?'❚❚':'▶'}</button>

  <form class="form" data-form="logSession">

    <input type="number" id="logMin" min="1" max="600" placeholder="Minutes" required>
    <input type="date" id="logDate" value="${today()}">
    <button class="btn" type="submit">Log</button>
  </form>
  <h2>Recent sessions</h2>
  ${[...S.sessions].reverse().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<div class="card row"><span class="dot" style="background:${subjectColor(x.subjectId)}"></span>
    <div class="grow trunc">${esc(subjectName(x.subjectId))}</div><span class="meta" style="font-family:var(--mono)">${x.minutes}m · ${x.date}</span>
    <button class="iconbtn" data-action="rmSession" data-id="${x.id}" aria-label="Delete">✕</button></div>`).join('')||'<p class="empty">No sessions yet.</p>'}`;
}

function viewCards(){
  if(!S.subjects.length)return noSubjects(['Flashcards','Spaced repetition, sorted by subject.']);
  const deck=S.decks.find(d=>d.id===reviewDeck)||S.decks[0];
  const chips=S.decks.map(d=>`<button class="chip ${deck&&d.id===deck.id?'active':''}" data-action="pickDeck" data-id="${d.id}">
    <span class="dot" style="background:${subjectColor(d.subjectId)}"></span>${esc(d.name)}</button>`).join('');
  let body;
  const dueCards=deck?deck.cards.filter(c=>c.due<=today()):[];
  if(deck&&reviewQueue.length){
    const c=reviewQueue[0];
    body=`<p class="meta" style="margin-bottom:8px">${reviewQueue.length} card${reviewQueue.length!==1?'s':''} left</p>
      <div class="review">${esc(reviewRevealed?c.back:c.front)}</div>
      <div class="review-actions">
      ${reviewRevealed?`<button class="btn ghost" data-action="grade" data-ok="0" style="border-color:var(--danger);color:var(--danger)">✕ Missed it</button>
        <button class="btn" data-action="grade" data-ok="1">✓ Got it</button>`
        :`<button class="btn" data-action="reveal">Show answer →</button>`}
      </div>`;
  }else if(deck){
    body=`<div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="meta">${deck.cards.length} cards · ${dueCards.length} due today</span>
      <span class="row" style="gap:6px">
        <button class="btn" data-action="startReview" ${dueCards.length?'':'disabled'} style="padding:6px 12px;font-size:12px">Review due</button>
        <button class="btn ghost" data-action="rmDeck" style="padding:6px 10px;font-size:12px">Delete deck</button>
      </span></div>
      <form class="form" data-form="addCard">
        <input type="text" id="cardFront" placeholder="Front (question)" required>
        <input type="text" id="cardBack" placeholder="Back (answer)" required>
        <button class="btn" type="submit" style="flex-basis:100%">Add card</button>
      </form>
      ${deck.cards.map(c=>`<div class="card row"><span class="grow trunc">${esc(c.front)}</span>
        <span class="meta" style="font-family:var(--mono)">box ${c.box}</span>
        <button class="iconbtn" data-action="rmCard" data-id="${c.id}" aria-label="Delete">✕</button></div>`).join('')||'<p class="empty">No cards yet.</p>'}`;
  }else{
    body='<p class="empty">Create a deck to add cards.</p>';
  }
  return `<div class="head"><h1>Flashcards</h1><p class="sub">Spaced repetition, sorted by subject.</p></div>
  <div class="chips">${chips}</div>
  <form class="form" data-form="addDeck">
    <input type="text" id="deckName" placeholder="New deck name" required>
    <select id="deckSubject">${S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <button class="btn" type="submit">+</button>
  </form>
  ${body}`;
}


const HW=[['indig','Indigenous Language'],['math','Math'],['eng','English'],['chem','Chemistry'],['geo','Geography'],['bio','Biology'],['phys','Physics'],['acc','Accounts'],['hss','HSS'],['cs','Computer Science']];
let hwOffset=0;
function weekKey(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
  const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function weekLabel(off){const [y,m,d]=weekKey(off).split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short'});}

function viewHomework(){
  const wk=weekKey(hwOffset),done=S.homework[wk]||[],n=done.length,total=HW.length;
  const title=hwOffset===0?'This week':hwOffset===-1?'Last week':hwOffset===1?'Next week':'Week';
  const rows=HW.map(([k,name])=>{const d=done.includes(k);
    return `<button class="card row" data-action="toggleHw" data-id="${k}" aria-pressed="${d}" style="width:100%;text-align:left;margin-bottom:8px">
      <span class="check ${d?'done':''}" style="pointer-events:none">${d?'✓':''}</span>
      <span class="grow trunc" style="${d?'color:var(--ink-dim);text-decoration:line-through':''}">${name}</span></button>`;}).join('');
  return `<div class="head"><h1>Homework</h1><p class="sub">Tick off what you've finished this week.</p></div>
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <button class="btn ghost" data-action="hwPrev" aria-label="Previous week" style="padding:6px 12px">‹</button>
    <button class="iconbtn" data-action="hwNow" style="color:var(--ink);flex-direction:column;align-items:center"><b>${title}</b><span class="meta">Week of ${weekLabel(hwOffset)}</span></button>
    <button class="btn ghost" data-action="hwNext" aria-label="Next week" style="padding:6px 12px">›</button>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><span style="font-weight:500">${n===total?'All homework done 🎉':'Progress'}</span><b style="font-family:var(--mono)">${n}/${total}</b></div>
    <div style="height:8px;border-radius:4px;background:var(--track);overflow:hidden"><div style="height:100%;width:${n/total*100}%;background:var(--good);transition:width .25s"></div></div>
  </div>
  ${rows}
  <div class="row" style="gap:8px;margin-top:6px">
    <button class="btn ghost" data-action="hwAll" style="flex:1">Mark all done</button>
    <button class="btn ghost" data-action="hwClear" style="flex:1">Clear week</button>
  </div>`;
}

function viewNotes(){
  if(!S.subjects.length)return noSubjects(['Notes','Quick captures while you study.']);
  const rows=S.notes.map(n=>`<div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="grow"><div style="font-weight:500">${esc(n.title)}</div>
      <div class="meta row" style="gap:5px"><span class="dot" style="background:${subjectColor(n.subjectId)}"></span>${esc(subjectName(n.subjectId))} · ${n.date}</div></div>
      <button class="iconbtn" data-action="rmNote" data-id="${n.id}" aria-label="Delete">✕</button>
    </div>${n.body?`<p style="margin-top:8px;font-size:14px">${esc(n.body)}</p>`:''}
  </div>`).join('');
  return `<div class="head"><h1>Notes</h1><p class="sub">Quick captures while you study.</p></div>
  <form data-form="addNote" style="margin-bottom:16px">
    <div class="form"><input type="text" id="noteTitle" placeholder="Note title" required>
    <select id="noteSubject">${S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    <textarea id="noteBody" rows="3" placeholder="What did you learn?" style="margin-bottom:8px"></textarea>
    <button class="btn" type="submit">Save note</button>
  </form>
  ${rows||'<p class="empty">No notes yet.</p>'}`;

function bind(){
  document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;reviewQueue=[];render();});

  const f=document.querySelector('[data-form=addSubject]');
  if(f)f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('subjName').value.trim();if(!v)return;
    S.subjects.push({id:uid(),name:v,color:COLORS[S.subjects.length%COLORS.length]});save();render();};

  const ft=document.querySelector('[data-form=addTask]');
  if(ft)ft.onsubmit=e=>{e.preventDefault();const v=document.getElementById('taskTitle').value.trim();if(!v)return;
    S.tasks.push({id:uid(),title:v,subjectId:document.getElementById('taskSubject').value,date:document.getElementById('taskDate').value||today(),done:false});
    save();render();};

  const fd=document.querySelector('[data-form=addDeck]');
  if(fd)fd.onsubmit=e=>{e.preventDefault();const v=document.getElementById('deckName').value.trim();if(!v)return;
    const d={id:uid(),name:v,subjectId:document.getElementById('deckSubject').value,cards:[]};
    S.decks.push(d);reviewDeck=d.id;save();render();};

  const fc=document.querySelector('[data-form=addCard]');
  if(fc)fc.onsubmit=e=>{e.preventDefault();const fr=document.getElementById('cardFront').value.trim(),bk=document.getElementById('cardBack').value.trim();
    if(!fr||!bk)return;const d=S.decks.find(x=>x.id===reviewDeck);
    d.cards.push({id:uid(),front:fr,back:bk,box:1,due:today()});save();render();};

  const fn=document.querySelector('[data-form=addNote]');
  if(fn)fn.onsubmit=e=>{e.preventDefault();const v=document.getElementById('noteTitle').value.trim();if(!v)return;
    S.notes.unshift({id:uid(),title:v,subjectId:document.getElementById('noteSubject').value,body:document.getElementById('noteBody').value.trim(),date:today()});
    save();render();};

  const fe=document.querySelector('[data-form=setExam]');
  if(fe)fe.onsubmit=e=>{e.preventDefault();S.exam={name:document.getElementById('examName').value.trim(),date:document.getElementById('examDate').value};save();render();};
  const fl=document.querySelector('[data-form=logSession]');
  if(fl)fl.onsubmit=e=>{e.preventDefault();const m=Math.round(+document.getElementById('logMin').value);if(!(m>0))return;
    S.sessions.push({id:uid(),subjectId:document.getElementById('logSubject').value,minutes:m,date:document.getElementById('logDate').value||today()});save();render();};

  document.getElementById('welcome').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
    const inp=document.getElementById('wName');if(inp)wDraft=inp.value;
    if(a==='theme'){setTheme(curTheme()==='dark'?'light':'dark');render();}
    else if(a==='start'){const v=wDraft.trim();if(v){S.name=v;save();}try{localStorage.setItem('studydesk_welcomed','1');}catch(e){}showWelcome=false;render();}};

  document.getElementById('app').onclick=e=>{
    const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
    if(a==='dismissTip'){tipDismissed=true;render();}
    else if(a==='theme'){setTheme(curTheme()==='dark'?'light':'dark');render();}
    else if(a==='openWelcome'){showWelcome=true;render();}
    else if(a==='rmSubject'){S.subjects=S.subjects.filter(s=>s.id!==id);S.tasks=S.tasks.filter(t=>t.subjectId!==id);
      S.sessions=S.sessions.filter(s=>s.subjectId!==id);S.decks=S.decks.filter(d=>d.subjectId!==id);S.notes=S.notes.filter(n=>n.subjectId!==id);save();render();}
    else if(a==='toggleTask'){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render();}
    else if(a==='toggleHw'){const wk=weekKey(hwOffset),l=S.homework[wk]||[];S.homework[wk]=l.includes(id)?l.filter(x=>x!==id):[...l,id];save();render();}
    else if(a==='hwPrev'){hwOffset--;render();}
    else if(a==='hwNext'){hwOffset++;render();}
    else if(a==='hwNow'){hwOffset=0;render();}
    else if(a==='hwAll'){S.homework[weekKey(hwOffset)]=HW.map(x=>x[0]);save();render();}
    else if(a==='hwClear'){S.homework[weekKey(hwOffset)]=[];save();render();}
    else if(a==='rmTask'){S.tasks=S.tasks.filter(t=>t.id!==id);save();render();}
    else if(a==='rmSession'){S.sessions=S.sessions.filter(x=>x.id!==id);save();render();}
    else if(a==='clearExam'){delete S.exam;save();render();}
    else if(a==='rmNote'){S.notes=S.notes.filter(n=>n.id!==id);save();render();}
    else if(a==='rmCard'){const d=S.decks.find(x=>x.id===reviewDeck);d.cards=d.cards.filter(c=>c.id!==id);save();render();}
    else if(a==='rmDeck'){S.decks=S.decks.filter(d=>d.id!==reviewDeck);reviewDeck=null;save();render();}
    else if(a==='pickDeck'){reviewDeck=id;reviewQueue=[];render();}
    else if(a==='startReview'){const d=S.decks.find(x=>x.id===reviewDeck);reviewQueue=d.cards.filter(c=>c.due<=today());reviewRevealed=false;render();}
    else if(a==='reveal'){reviewRevealed=true;render();}
    else if(a==='grade'){const ok=b.dataset.ok==='1';const cur=reviewQueue[0];const d=S.decks.find(x=>x.id===reviewDeck);
      const card=d.cards.find(c=>c.id===cur.id);card.box=ok?Math.min(5,card.box+1):1;card.due=addDays(today(),BOX[card.box]);
      save();reviewQueue=reviewQueue.slice(1);reviewRevealed=false;render();}
  };

  const fs=document.getElementById('focusSubject');if(fs)fs.onchange=e=>{timer.subjectId=e.target.value;};
  const wi=document.getElementById('workMin');if(wi)wi.onchange=e=>{timer.work=Math.max(1,+e.target.value||25);if(timer.mode==='work'&&!timer.running)timer.remaining=timer.work*60;render();};
  const bi=document.getElementById('breakMin');if(bi)bi.onchange=e=>{timer.break=Math.max(1,+e.target.value||5);if(timer.mode==='break'&&!timer.running)timer.remaining=timer.break*60;render();};
  const tt=document.getElementById('toggleTimer');if(tt)tt.onclick=()=>{timer.running=!timer.running;if(timer.running)timer.last=Date.now();render();};
  const rt=document.getElementById('resetTimer');if(rt)rt.onclick=()=>{timer.running=false;logWork();timer.mode='work';timer.remaining=timer.work*60;render();};
}

function logWork(){
  if(timer.mode==='work'&&timer.subjectId&&timer.elapsed>=60){S.sessions.push({id:uid(),subjectId:timer.subjectId,minutes:Math.floor(timer.elapsed/60),date:today()});save();}
  timer.elapsed=0;
}
function tick(){
  if(!timer.running)return;
  const now=Date.now(),d=Math.round((now-timer.last)/1000);if(d<1)return;
  timer.last=now;timer.remaining-=d;if(timer.mode==='work')timer.elapsed+=d;
  if(timer.remaining<=0){
    timer.elapsed=Math.min(timer.elapsed,timer.work*60);logWork();
    timer.mode=timer.mode==='work'?'break':'work';
    timer.remaining=(timer.mode==='work'?timer.work:timer.break)*60;
    if(tab==='focus')render();
  }else if(tab==='focus'){
    const el=document.getElementById('timerNum');
    if(el){el.textContent=String(Math.floor(timer.remaining/60)).padStart(2,'0')+':'+String(timer.remaining%60).padStart(2,'0');}
  }
}
setInterval(tick,1000);
render();
initSync();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
